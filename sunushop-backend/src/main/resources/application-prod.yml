spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

# ===== ACTUATOR =====
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ===== CORS (pour autoriser Vercel) =====
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

# ===== JWT =====
jwt:
  secret: ${JWT_SECRET}

# ===== LOGGING (moins verbeux en prod) =====
logging:
  level:
    com.sunushop: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN