spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/sunushop}
    username: ${DB_USERNAME:sunu}
    password: ${DB_PASSWORD:sunu123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false

server:
  port: 8081
  servlet:
    context-path: /api

logging:
  level:
    com.sunushop: INFO
    org.springframework.web: WARN