spring:
  application:
    name: sunushop-stock-api
  datasource:
    url: jdbc:postgresql://localhost:5433/sunushop
    username: sunu
    password: sunu123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081
  servlet:
    context-path: /api

# ===== ACTUATOR (Monitoring) =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# ===== SWAGGER (Documentation) =====
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# ===== LOGGING =====
logging:
  level:
    com.sunushop: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG