spring:
  application:
    name: sunushop-stock-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sunushop}
    username: ${SPRING_DATASOURCE_USERNAME:sunu}
    password: ${SPRING_DATASOURCE_PASSWORD:sunu123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: false
  mail:
    host: ${SPRING_MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${SPRING_MAIL_PORT:2525}
    username: ${SPRING_MAIL_USERNAME:placeholder}
    password: ${SPRING_MAIL_PASSWORD:placeholder}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: ${PORT:8081}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

jwt:
  secret: ${JWT_SECRET:SunuShopStock2026JwtSecretVeryLongStringForHs256AlgorithmMinimum256Bits}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

sunushop:
  mail:
    from: ${SUNUSHOP_MAIL_FROM:noreply@sunushop.com}
  low-stock-threshold: ${SUNUSHOP_LOW_STOCK_THRESHOLD:5}

logging:
  level:
    com.sunushop: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:aajoj7dd}
  api-key: ${CLOUDINARY_API_KEY:799618931576316}
  api-secret: ${CLOUDINARY_API_SECRET:placeholder}