spring:
  application:
    name: sunushop-stock-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sunushop}
    username: ${SPRING_DATASOURCE_USERNAME:sunu}
    password: ${SPRING_DATASOURCE_PASSWORD:sunu123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: false

server:
  port: ${PORT:8081}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

jwt:
  secret: ${JWT_SECRET:default-secret-key-for-dev-only-min-256-bits-long-enough-for-hs256-algorithm}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.sunushop: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN