stages:
  - backend-build
  - backend-test
  - frontend-install
  - frontend-test
  - frontend-build

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  paths:
    - .m2/repository/
    - sunushop-frontend/node_modules/

backend-build:
  stage: backend-build
  image: maven:3.8-openjdk-17
  script:
    - echo "Build backend"
    - cd sunushop-backend
    - mvn clean compile -B
  only:
    - main
    - merge_requests

backend-test:
  stage: backend-test
  image: maven:3.8-openjdk-17
  script:
    - echo "Tests backend"
    - cd sunushop-backend
    - mvn test -B
  artifacts:
    when: always
    reports:
      junit:
        - sunushop-backend/target/surefire-reports/TEST-*.xml
  only:
    - main
    - merge_requests

frontend-install:
  stage: frontend-install
  image: node:20-alpine
  script:
    - echo "Install frontend"
    - cd sunushop-frontend
    - npm ci
  only:
    - main
    - merge_requests

frontend-test:
  stage: frontend-test
  image: node:20-alpine
  script:
    - echo "Tests frontend"
    - cd sunushop-frontend
    - npm ci
    - npm test -- --watch=false --browsers=ChromeHeadless
  only:
    - main
    - merge_requests

frontend-build:
  stage: frontend-build
  image: node:20-alpine
  script:
    - echo "Build frontend"
    - cd sunushop-frontend
    - npm ci
    - npm run build -- --configuration production
  only:
    - main