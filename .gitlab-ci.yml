stages:
  - backend-build
  - backend-test
  - frontend-test
  - frontend-build

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository/
    - sunushop-frontend/node_modules/

backend-build:
  stage: backend-build
  image: maven:3.8-openjdk-17
  script:
    - cd sunushop-backend
    - mvn clean compile -B
  only:
    - main
    - merge_requests

backend-test:
  stage: backend-test
  image: maven:3.8-openjdk-17
  script:
    - cd sunushop-backend
    - mvn verify -B
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    reports:
      junit:
        - sunushop-backend/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: sunushop-backend/target/site/jacoco/jacoco.xml
    paths:
      - sunushop-backend/target/site/jacoco/
    expire_in: 1 week
  only:
    - main
    - merge_requests

frontend-test:
  stage: frontend-test
  image: trion/ng-cli-karma:19.2.0
  script:
    - cd sunushop-frontend
    - npm install --legacy-peer-deps
    - npm run test:ci
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - sunushop-frontend/coverage/
    expire_in: 1 week
  only:
    - main
    - merge_requests

frontend-build:
  stage: frontend-build
  image: node:20-alpine
  script:
    - cd sunushop-frontend
    - npm install --legacy-peer-deps
    - npm run build -- --configuration production
  artifacts:
    paths:
      - sunushop-frontend/dist/
    expire_in: 1 week
  only:
    - main