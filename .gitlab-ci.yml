stages:
  - backend-build
  - frontend-build

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository/
    - sunushop-frontend/node_modules/

backend-build:
  stage: backend-build
  image: maven:3.8-openjdk-17
  script:
    - cd sunushop-backend
    - mvn clean package -Dmaven.test.skip=true -B
  artifacts:
    paths:
      - sunushop-backend/target/*.jar
    expire_in: 1 week
  only:
    - main
    - merge_requests

frontend-build:
  stage: frontend-build
  image: node:20-alpine
  script:
    - cd sunushop-frontend
    - npm install --legacy-peer-deps
    - npm run build -- --configuration production
  artifacts:
    paths:
      - sunushop-frontend/dist/
    expire_in: 1 week
  only:
    - main
    - merge_requests